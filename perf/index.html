<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131a1e">
<title>Wildsong Ranch · Performance check</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { margin: 0; background: #131a1e; color: #e9eef0; padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)); }
  h1 { font-size: 1.3rem; margin: 0 0 8px; }
  p { line-height: 1.45; margin: 6px 0; }
  .muted { color: #9fb0b5; font-size: 0.9rem; }
  .buttons { display: flex; flex-direction: column; gap: 10px; margin: 14px 0; }
  button { min-height: 48px; border-radius: 12px; border: 0; background: #2fa597; color: #06201d; font-size: 1rem; font-weight: 600; padding: 10px 14px; }
  button.secondary { background: #24323a; color: #e9eef0; }
  .status { font-weight: 600; }
  .live { font-variant-numeric: tabular-nums; color: #bfe9e2; min-height: 1.4em; }
  .stage canvas { display: block; width: 100%; aspect-ratio: 3 / 4; border-radius: 12px; background: #8a8b8f; }
  .pass, .fail { font-size: 2.2rem; font-weight: 800; margin: 12px 0; }
  .pass { color: #7be0a4; } .fail { color: #ff9a8a; }
  pre { white-space: pre-wrap; word-break: break-word; background: #0b1013; border-radius: 10px; padding: 10px; font-size: 0.78rem; }
  .frames { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .frames img { width: 100%; border-radius: 8px; }
  figure { margin: 0; } figcaption { text-align: center; font-size: 0.85rem; }
</style>
</head>
<body>
<main id="app"></main>
<script type="module" src="/src/art3d/perf/main.ts"></script>
</body>
</html>
